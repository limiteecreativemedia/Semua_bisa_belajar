<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Bisa Belajar - Matematika Seru SD</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #0f172a; }

<body class="bg-slate-900 text-white selection:bg-amber-500 selection:text-slate-950">

    <div id="app" class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative shadow-2xl bg-slate-900 overflow-hidden">

        <header id="header-container" class="bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">

        </header>

        <!-- MAIN CONTAINER -->
        <main id="main-content" class="flex-grow overflow-y-auto pb-44">
            <!-- Dynamic Content loaded by JS -->
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-3 z-50 max-w-md mx-auto pb-safe shadow-lg">
            <button onclick="router('home')" id="nav-home" class="flex flex-col items-center p-2 rounded-xl text-slate-400 transition">

            <button onclick="router('slimeGame')" id="nav-slimeGame" class="flex flex-col items-center p-2 rounded-xl text-slate-400 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8 4-8-4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>

                <span class="text-[10px] font-bold">Profil</span>
            </button>
        </nav>
    </div>

    <script>
        const LEVELS = [
            { id: 1, title: "LEVEL 1", name: "Penjumlahan & Pengurangan Seru", color: "bg-emerald-600", desc: "Belajar hitung cepat angka puluhan & ratusan dengan asyik." },
            { id: 2, title: "LEVEL 2", name: "Perkalian & Pembagian Dasar", color: "bg-teal-600", desc: "Tabel perkalian 1 sampai 10 dan pembagian sederhana." },
            { id: 3, title: "LEVEL 3", name: "Pecahan Sederhana", color: "bg-cyan-600", desc: "Mengenal setengah, seperempat, dan penjumlahan pecahan berpenyebut sama." },
            { id: 4, title: "LEVEL 4", name: "Keliling & Luas Bangun Datar", color: "bg-blue-600", desc: "Menghitung luas persegi, persegi panjang, dan segitiga." },
            { id: 5, title: "LEVEL 5", name: "Kecepatan & Waktu Perjalanan", color: "bg-indigo-600", desc: "Rumus jarak = kecepatan × waktu untuk anak SD." },
            { id: 6, title: "LEVEL 6", name: "Soal Cerita Logika & Umur", color: "bg-violet-600", desc: "Teka-teki logika umur keluarga dan kelereng." },
            { id: 7, title: "LEVEL 7", name: "Pola Bilangan & Barisan Asyik", color: "bg-purple-600", desc: "Mencari angka selanjutnya dalam barisan bilangan." },
            { id: 8, title: "LEVEL 8", name: "Statistika Data Sederhana", color: "bg-fuchsia-600", desc: "Mencari rata-rata (mean), modus, dan nilai tengah." },
            { id: 9, title: "LEVEL 9", name: "Teka-Teki Gabungan SD Juara", color: "bg-rose-600", desc: "Kombinasi soal cerita olimpiade tingkat SD." },
            { id: 10, title: "LEVEL 10", name: "Grand Master SD Champion", color: "bg-amber-600", desc: "Ujian akhir matematika paling seru tingkat SD!" }
        ];

        const CONTENT = {
            1: {
                lesson: { 
                    title: "Penjumlahan & Pengurangan Cepat", 
                    concept: "Belajar menghitung bilangan puluhan dan ratusan dengan cepat menggunakan cara bersusun pendek atau pengelompokan puluhan.", 
                    trick: "Jika menjumlahkan angka seperti 48 + 27, hitung 50 + 27 lalu kurangi 2 (= 75).", 
                    examples: [{ 
                        q: "Ibu membeli 125 buah jeruk, lalu membeli lagi 75 buah. Berapa jumlah seluruh jeruk ibu?", 
                        think: "Jumlahkan buah jeruk pertama dan kedua secara bersusun.", 
                        step1: "125 + 75 = ...", 
                        step2: "5+5 = 10 (tulis 0 simpan 1). 2+7+1 = 10 (tulis 0 simpan 1). 1+1 = 2 (200).", 
                        ans: "Jumlah seluruh jeruk ibu adalah 200 buah." 
                    }] 
                }
            },
            2: {
                lesson: { 
                    title: "Perkalian & Pembagian Dasar", 
                    concept: "Perkalian adalah penjumlahan berulang, sedangkan pembagian adalah pengurangan berulang atau membagi rata ke beberapa kelompok.", 
                    trick: "Untuk perkalian 9, gunakan jari tangan atau pastikan angka puluhan selalu naik dan satuan turun (misal 9×3 = 27).", 
                    examples: [{ 
                        q: "Ani memasukkan 6 buah kue ke dalam setiap 8 kotak. Berapa total kue seluruhnya?", 
                        think: "Kalikan jumlah kotak dengan isi kue per kotak.", 
                        step1: "8 kotak × 6 kue = 48.", 
                        ans: "Total kue seluruhnya adalah 48 buah." 
                    }] 
                }
            },
            3: {
                lesson: { 
                    title: "Pecahan Sederhana", 
                    concept: "Mengenal bentuk pecahan seperti 1/2, 1/4, dan 3/4 serta cara menjumlahkan pecahan dengan penyebut yang sama.", 
                    trick: "Jika penyebutnya sama, tinggal jumlahkan pembilang di bagian atasnya saja!", 
                    examples: [{ 
                        q: "Berapa hasil dari 2/5 + 1/5?", 
                        think: "Penyebut sudah sama (5), jumlahkan pembilang 2 + 1.", 
                        step1: "2 + 1 = 3.", 
                        ans: "Hasilnya adalah 3/5." 
                    }] 
                }
            },
            4: {
                lesson: { 
                    title: "Keliling & Luas Bangun Datar", 
                    concept: "Belajar menghitung keliling (jumlah semua sisi) dan luas (panjang × lebar untuk persegi panjang atau sisi × sisi untuk persegi).", 
                    trick: "Keliling ibarat berjalan mengelilingi pagar luar taman, sedangkan luas adalah lantai rumput di dalamnya.", 
                    examples: [{ 
                        q: "Sebuah lantai berbentuk persegi panjang memiliki panjang 8 meter dan lebar 5 meter. Berapa luas lantai tersebut?", 
                        think: "Luas persegi panjang = Panjang × Lebar.", 
                        step1: "8 meter × 5 meter = 40.", 
                        ans: "Luas lantai adalah 40 meter persegi." 
                    }] 
                }
            },
            5: {
                lesson: { 
                    title: "Kecepatan & Waktu Perjalanan", 
                    concept: "Mengenal hubungan antara Jarak, Kecepatan, dan Waktu (J = K × W).", 
                    trick: "Gunakan rumus segitiga JKW: Jarak di atas, Kecepatan dan Waktu di bawah.", 
                    examples: [{ 
                        q: "Sebuah mobil melaju dengan kecepatan 60 km/jam selama 2 jam. Berapa jarak yang ditempuh mobil tersebut?", 
                        think: "Jarak = Kecepatan × Waktu.", 
                        step1: "60 km/jam × 2 jam = 120 km.", 
                        ans: "Jarak yang ditempuh adalah 120 km." 
                    }] 
                }
            },
            6: {
                lesson: { 
                    title: "Soal Cerita Logika & Umur", 
                    concept: "Mengasah penalaran logika sehari-hari seperti teka-teki umur keluarga, kelereng, dan hewan.", 
                    trick: "Uraikan kalimat soal cerita satu persatu dari belakang atau gunakan pemisalan sederhana.", 
                    examples: [{ 
                        q: "Umur ayah sekarang 4 kali umur Budi. Jika umur Budi 10 tahun, berapa umur ayah?", 
                        think: "Kalikan umur Budi dengan 4.", 
                        step1: "4 × 10 tahun = 40 tahun.", 
                        ans: "Umur ayah adalah 40 tahun." 
                    }] 
                }
            },
            7: {
                lesson: { 
                    title: "Pola Bilangan & Barisan Asyik", 
                    concept: "Mencari aturan perubahan dalam barisan angka dan melengkapi angka yang hilang.", 
                    trick: "Perhatikan apakah angkanya bertambah tetap (tambah 2, tambah 3) atau dikali (kali 2, kali 3).", 
                    examples: [{ 
                        q: "Tentukan angka selanjutnya dari barisan: 3, 6, 9, 12, ...", 
                        think: "Perhatikan selisih antar angka selalu bertambah 3.", 
                        step1: "12 + 3 = 15.", 
                        ans: "Angka selanjutnya adalah 15." 
                    }] 
                }
            },
            8: {
                lesson: { 
                    title: "Statistika Data Sederhana", 
                    concept: "Mengenal rata-rata (mean), nilai yang sering muncul (modus), dan nilai tengah (median).", 
                    trick: "Rata-rata = (Jumlah seluruh data) dibagi (Banyaknya data).", 
                    examples: [{ 
                        q: "Nilai ulangan matematika Andi adalah 80, 90, dan 70. Berapa rata-rata nilai Andi?", 
                        think: "Jumlahkan semua nilai lalu bagi dengan banyaknya ulangan (3).", 
                        step1: "80 + 90 + 70 = 240.", 
                        step2: "240 ÷ 3 = 80.", 
                        ans: "Rata-rata nilai Andi adalah 80." 
                    }] 
                }
            },
            9: {
                lesson: { 
                    title: "Teka-Teki Gabungan SD Juara", 
                    concept: "Menggabungkan logika pecahan, umur, uang, dan kecepatan dalam satu cerita seru.", 
                    trick: "Baca soal secara teliti dan buat catatan kecil untuk setiap informasi yang diketahui.", 
                    examples: [{ 
                        q: "Uang Rani Rp20.000. Ia membeli buku seharga Rp8.000 dan pensil Rp3.000. Berapa sisa uang Rani?", 
                        think: "Kurangkan total belanjaan dari uang awal Rani.", 
                        step1: "Total belanja = 8.000 + 3.000 = 11.000.", 
                        step2: "20.000 - 11.000 = 9.000.", 
                        ans: "Sisa uang Rani adalah Rp9.000." 
                    }] 
                }
            },
            10: {
                lesson: { 
                    title: "Grand Master SD Champion", 
                    concept: "Ujian komprehensif penutup tingkat SD untuk menguji seluruh kemampuan hitung cepat dan logika juara.", 
                    trick: "Tetap tenang, baca soal dengan cermat, dan periksa kembali hasil hitunganmu!", 
                    examples: [{ 
                        q: "Berapa hasil dari 50 + 50 × 0 + 50?", 
                        think: "Ingat aturan operasi hitung: kerjakan perkalian terlebih dahulu!", 
                        step1: "50 × 0 = 0.", 
                        step2: "50 + 0 + 50 = 100.", 
                        ans: "Hasilnya adalah 100." 
                    }] 
                }
            }
        };

        // --- DYNAMIC SMART QUESTION GENERATOR ---
        function generateDynamicQuestions(levelId, count = 5) {
            let questions = [];
            for (let i = 0; i < count; i++) {
                let qObj = {};
                if (levelId === 1) {
                    let a = Math.floor(Math.random() * 200) + 50;
                    let b = Math.floor(Math.random() * 150) + 20;
                    if (i % 2 === 0) {
                        let ans = a + b;
                        qObj.question = `Berapakah hasil dari ${a} + ${b}?`;
                        qObj.answer = ans.toString();
                        qObj.hints = [`Jumlahkan angka satuan, puluhan, dan ratusan secara bersusun.`];
                        qObj.explanation = `${a} + ${b} = ${ans}.`;
                    } else {
                        if (a < b) [a, b] = [b, a];
                        let ans = a - b;
                        qObj.question = `Berapakah hasil dari ${a} - ${b}?`;
                        qObj.answer = ans.toString();
                        qObj.hints = [`Kurangkan angka dari belakang secara teliti.`];
                        qObj.explanation = `${a} - ${b} = ${ans}.`;
                    }
                } else if (levelId === 2) {
                    let a = Math.floor(Math.random() * 8) + 3;
                    let b = Math.floor(Math.random() * 8) + 3;
                    if (i % 2 === 0) {
                        let ans = a * b;
                        qObj.question = `Berapakah hasil perkalian dari ${a} × ${b}?`;
                        qObj.answer = ans.toString();
                        qObj.hints = [`Perkalian adalah penjumlahan berulang: ${a} sebanyak ${b} kali.`];
                        qObj.explanation = `${a} × ${b} = ${ans}.`;
                    } else {
                        let prod = a * b;
                        qObj.question = `Berapakah hasil pembagian dari ${prod} ÷ ${a}?`;
                        qObj.answer = b.toString();
                        qObj.hints = [`Cari perkalian ${a} yang hasilnya ${prod}.`];
                        qObj.explanation = `${prod} ÷ ${a} = ${b}.`;
                    }
                } else if (levelId === 3) {
                    let denom = [4, 6, 8, 10][Math.floor(Math.random() * 4)];
                    let num1 = Math.floor(Math.random() * (denom - 2)) + 1;
                    let num2 = Math.floor(Math.random() * (denom - num1 - 1)) + 1;
                    let sumNum = num1 + num2;
                    qObj.question = `Berapakah hasil dari ${num1}/${denom} + ${num2}/${denom}?`;
                    qObj.answer = `${sumNum}/${denom}`;
                    qObj.hints = [`Karena penyebut sudah sama (${denom}), jumlahkan pembilangnya saja!`];
                    qObj.explanation = `${num1}/${denom} + ${num2}/${denom} = ${sumNum}/${denom}.`;
                } else if (levelId === 4) {
                    let side = Math.floor(Math.random() * 15) + 5;
                    if (i % 2 === 0) {
                        let ans = 4 * side;
                        qObj.question = `Berapa keliling sebuah persegi yang memiliki panjang sisi ${side} cm?`;
                        qObj.answer = `${ans} cm`;
                        qObj.hints = [`Keliling persegi = 4 × sisi.`];
                        qObj.explanation = `4 × ${side} = ${ans} cm.`;
                    } else {
                        let ans = side * side;
                        qObj.question = `Berapa luas persegi dengan panjang sisi ${side} cm?`;
                        qObj.answer = `${ans} cm²`;
                        qObj.hints = [`Luas persegi = sisi × sisi.`];
                        qObj.explanation = `${side} × ${side} = ${ans} cm².`;
                    }
                } else if (levelId === 5) {
                    let speed = (Math.floor(Math.random() * 6) + 4) * 10;
                    let time = Math.floor(Math.random() * 4) + 2;
                    let dist = speed * time;
                    qObj.question = `Sebuah mobil melaju dengan kecepatan ${speed} km/jam selama ${time} jam. Berapa jarak yang ditempuh?`;
                    qObj.answer = `${dist} km`;
                    qObj.hints = [`Jarak = Kecepatan × Waktu.`];
                    qObj.explanation = `${speed} × ${time} = ${dist} km.`;
                } else if (levelId === 6) {
                    let childAge = Math.floor(Math.random() * 8) + 6;
                    let multiplier = Math.floor(Math.random() * 3) + 3;
                    let parentAge = childAge * multiplier;
                    qObj.question = `Umur ayah sekarang ${multiplier} kali umur Budi. Jika umur Budi ${childAge} tahun, berapa umur ayah?`;
                    qObj.answer = `${parentAge} tahun`;
                    qObj.hints = [`Kalikan umur Budi dengan ${multiplier}.`];
                    qObj.explanation = `${multiplier} × ${childAge} = ${parentAge} tahun.`;
                } else if (levelId === 7) {
                    let start = Math.floor(Math.random() * 10) + 2;
                    let step = Math.floor(Math.random() * 5) + 2;
                    let seq = [start, start + step, start + step*2, start + step*3];
                    let nextVal = start + step*4;
                    qObj.question = `Tentukan angka selanjutnya dari barisan: ${seq.join(', ')}, ...`;
                    qObj.answer = nextVal.toString();
                    qObj.hints = [`Perhatikan selisih tetap antar angka yaitu +${step}.`];
                    qObj.explanation = `${seq[3]} + ${step} = ${nextVal}.`;
                } else if (levelId === 8) {
                    let n1 = Math.floor(Math.random() * 20) + 60;
                    let n2 = n1 + 10;
                    let n3 = n2 + 10;
                    let mean = (n1 + n2 + n3) / 3;
                    qObj.question = `Berapa rata-rata dari tiga angka berikut: ${n1}, ${n2}, ${n3}?`;
                    qObj.answer = mean.toString();
                    qObj.hints = [`Jumlahkan ketiga angka lalu bagi dengan 3.`];
                    qObj.explanation = `(${n1} + ${n2} + ${n3}) / 3 = ${mean}.`;
                } else if (levelId === 9) {
                    let initial = Math.floor(Math.random() * 20) + 30;
                    let buy1 = Math.floor(Math.random() * 10) + 5;
                    let buy2 = Math.floor(Math.random() * 10) + 5;
                    let left = initial * 1000 - (buy1 * 1000 + buy2 * 1000);
                    qObj.question = `Uang Rani Rp${initial}.000. Ia membeli buku Rp${buy1}.000 dan pensil Rp${buy2}.000. Berapa sisa uang Rani?`;
                    qObj.answer = `Rp${left / 1000}.000`;
                    qObj.hints = [`Kurangkan total belanjaan dari uang awal.`];
                    qObj.explanation = `Rp${initial}.000 - (Rp${buy1}.000 + Rp${buy2}.000) = Rp${left / 1000}.000.`;
                } else {
                    let x = Math.floor(Math.random() * 10) + 5;
                    let y = Math.floor(Math.random() * 10) + 5;
                    let ans = 100 + x * y;
                    qObj.question = `Berapa hasil dari 100 + ${x} × ${y}?`;
                    qObj.answer = ans.toString();
                    qObj.hints = [`Kerjakan operasi perkalian terlebih dahulu!`];
                    qObj.explanation = `${x} × ${y} = ${x*y}, lalu 100 + ${x*y} = ${ans}.`;
                }

                // Generate 3 plausible wrong options
                let wrongOptions = [];
                let correctNum = parseFloat(qObj.answer) || 0;
                while (wrongOptions.length < 3) {
                    let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                    let fake = isNaN(correctNum) ? qObj.answer : (correctNum + offset).toString();
                    if (qObj.answer.includes('cm') || qObj.answer.includes('tahun') || qObj.answer.includes('km') || qObj.answer.includes('Rp')) {
                        let suffix = qObj.answer.replace(/[0-9]/g, '');
                        let baseVal = parseInt(qObj.answer) || 10;
                        fake = (baseVal + offset) + suffix;
                    }
                    if (fake !== qObj.answer && !wrongOptions.includes(fake)) {
                        wrongOptions.push(fake);
                    }
                }

                qObj.options = shuffleArray([qObj.answer, ...wrongOptions]);
                questions.push(qObj);
            }
            return questions;
        }

        let profiles = JSON.parse(localStorage.getItem('sbb_sd_profiles')) || [];
        let currentUserId = localStorage.getItem('sbb_sd_current_user') || null;

        function getActiveUser() {
            return profiles.find(p => p.id === currentUserId) || null;
        }

        function saveProfiles() {
            localStorage.setItem('sbb_sd_profiles', JSON.stringify(profiles));
            localStorage.setItem('sbb_sd_current_user', currentUserId);
        }

        let currentView = 'profiles';
        let activeLevelId = 1;
        let quizState = { 
            isExam: false, 
            questions: [], 
            currentIndex: 0, 
            score: 0, 
            selectedOption: null, 
            hintLevel: 0, 
            mistakes: 0,
            timeLeft: 60,
            timerInterval: null
        };

        // Slime Math Shooter Game State
        let slimeGameState = {
            level: 1,
            questionIndex: 0,
            maxQuestions: 10,
            score: 0,
            hp: 3,
            timeLeft: 15,
            maxTime: 15,
            timerInterval: null,
            currentQ: null,
            slimeName: 'Slime Hijau Ceria',
            slimeEmoji: '🟢',
            slimePos: 10
        };

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function handleBackAction() {
            if (currentView === 'lesson' || currentView === 'examIntro') router('levelIntro', activeLevelId);
            else if (currentView === 'levelIntro') router('map');
            else if (currentView === 'practice' || currentView === 'exam') router('lesson', activeLevelId);
            else if (currentView === 'slimeArena' || currentView === 'slimeResult') router('slimeGame');
            else router('map');
        }

        function router(viewName, levelId = null) {
            if (quizState.timerInterval) {
                clearInterval(quizState.timerInterval);
                quizState.timerInterval = null;
            }
            if (slimeGameState.timerInterval) {
                clearInterval(slimeGameState.timerInterval);
                slimeGameState.timerInterval = null;
            }

            if (viewName !== 'profiles' && !getActiveUser()) {
                currentView = 'profiles';
            } else {
                currentView = viewName;
            }

            if (levelId !== null) activeLevelId = levelId;

            const header = document.getElementById('header-container');
            const nav = document.getElementById('bottom-nav');
            const main = document.getElementById('main-content');
            const user = getActiveUser();

            if (user) {
                const userNameSpan = document.getElementById('current-user-name');
                const starCountSpan = document.getElementById('star-count');
                if (userNameSpan) userNameSpan.innerText = user.name;
                if (starCountSpan) starCountSpan.innerText = user.stars;
            }

            if (currentView === 'profiles') {
                if (header) header.classList.add('hidden');
                if (nav) nav.classList.add('hidden');
            } else {
                if (header) header.classList.remove('hidden');
                if (nav) nav.classList.remove('hidden');
            }

            ['home', 'map', 'slimeGame', 'dashboard'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                if (btn) {
                    if (id === currentView || (id === 'slimeGame' && (currentView === 'slimeGame' || currentView === 'slimeArena' || currentView === 'slimeResult'))) {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-amber-400 font-bold transform scale-105 transition";
                    } else {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-slate-400 transition";
                    }
                }
            });

            if (main) {
                main.innerHTML = '';
                if (currentView === 'profiles') renderProfiles(main);
                else if (currentView === 'home') renderHome(main);
                else if (currentView === 'map') renderMap(main);
                else if (currentView === 'dashboard') renderDashboard(main);
                else if (currentView === 'levelIntro') renderLevelIntro(main);
                else if (currentView === 'lesson') renderLesson(main);
                else if (currentView === 'examIntro') renderExamIntro(main);
                else if (currentView === 'practice' || currentView === 'exam') renderQuiz(main);
                else if (currentView === 'examResult') renderExamResult(main);
                else if (currentView === 'slimeGame') renderSlimeHome(main);
                else if (currentView === 'slimeArena') renderSlimeArena(main);
                else if (currentView === 'slimeResult') renderSlimeResult(main);
            }
        }

        function createNewProfile() {
            const input = document.getElementById('new-profile-name');
            if (!input) return;
            const name = input.value.trim();
            if (!name) {
                alert('Nama tidak boleh kosong!');
                return;
            }

            const newId = 'user_' + Date.now();
            profiles.push({
                id: newId,
                name: name,
                stars: 0,
                completedLevels: [],
                unlockedLevels: [1],
                badges: []
            });
            currentUserId = newId;
            saveProfiles();
            router('home');
        }

        function selectProfile(id) {
            currentUserId = id;
            saveProfiles();
            router('home');
        }

        function deleteProfile(id) {
            if (!confirm('Yakin ingin menghapus profil ini?')) return;
            profiles = profiles.filter(p => p.id !== id);
            if (currentUserId === id) currentUserId = profiles.length > 0 ? profiles[0].id : null;
            saveProfiles();
            router('profiles');
        }

        function launchExam() {
            quizState = {
                isExam: true,
                questions: generateDynamicQuestions(activeLevelId, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintLevel: 0,
                mistakes: 0,
                timeLeft: 60,
                timerInterval: null
            };
            router('exam');
        }

        function renderQuiz(container) {
            const isExam = quizState.isExam;
            const q = quizState.questions[quizState.currentIndex];
            const headerTitle = document.getElementById('header-title');
            if (headerTitle) headerTitle.innerText = isExam ? `Ujian (Waktu: ${quizState.timeLeft}s)` : "Latihan Soal";

            if (isExam && !quizState.timerInterval) {
                quizState.timerInterval = setInterval(() => {
                    quizState.timeLeft--;
                    const timerEl = document.getElementById('exam-timer-display');
                    if (timerEl) timerEl.innerText = quizState.timeLeft + "s";
                    
                    if (quizState.timeLeft <= 0) {
                        clearInterval(quizState.timerInterval);
                        quizState.timerInterval = null;
                        handleNextQuestion(true);
                    }
                }, 1000);
            }

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleOptionSelect('${opt.toString().replace(/'/g, "\\'")}')" id="opt-btn-${idx}" class="w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-slate-700 bg-slate-900 text-slate-200 hover:border-blue-500 transition">
                        <span class="opacity-60 mr-2">${String.fromCharCode(65 + idx)}.</span> ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="p-5 pb-44 animate-fade-in flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] font-black text-blue-400 bg-blue-950 border border-blue-800 px-2.5 py-1 rounded-lg">Soal ${quizState.currentIndex + 1} / 5</span>
                        ${isExam ? `<span id="exam-timer-display" class="text-xs font-black px-3 py-1 rounded-full bg-rose-950 text-rose-300 border border-rose-800 animate-pulse">⏳ ${quizState.timeLeft}s</span>` : ''}
                    </div>

                    <div class="w-full bg-slate-800 h-2 rounded-full mb-5 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-500 to-amber-500 h-2 transition-all duration-300" style="width: ${((quizState.currentIndex) / quizState.questions.length) * 100}%"></div>
                    </div>

                    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-sm mb-5">
                        <h3 class="text-sm sm:text-base font-black text-white mt-1 mb-5 leading-relaxed">${q.question}</h3>
                        <div class="space-y-3" id="options-container">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div id="feedback-area"></div>
                </div>

                <div class="fixed bottom-16 left-0 right-0 p-4 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-center max-w-md mx-auto z-40 shadow-xl">
                    <button id="btn-next-quiz" onclick="handleNextQuestion(false)" disabled class="w-full bg-slate-800 text-slate-500 font-extrabold py-3.5 rounded-2xl transition text-xs cursor-not-allowed shadow">
                        ${quizState.currentIndex === quizState.questions.length - 1 ? 'SELESAI' : 'LANJUT SOAL ➔'}
                    </button>
                </div>
            `;
        }

        function handleOptionSelect(selected) {
            quizState.selectedOption = selected;
            const q = quizState.questions[quizState.currentIndex];
            const isExam = quizState.isExam;
            const correctAnswer = q.answer.toString();
            const user = getActiveUser();

            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`opt-btn-${idx}`);
                if (!btn) return;
                btn.disabled = true;
                if (opt.toString() === correctAnswer) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-emerald-500 bg-emerald-600 text-white shadow";
                } else if (opt.toString() === selected) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-rose-800 bg-rose-950 text-rose-300";
                } else {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-slate-800 opacity-40 bg-slate-900 text-slate-500";
                }
            });

            const nextBtn = document.getElementById('btn-next-quiz');
            if (nextBtn) {
                nextBtn.disabled = false;
                nextBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow-lg transition text-xs cursor-pointer animate-pulse";
            }

            if (!isExam) {
                const feedbackArea = document.getElementById('feedback-area');
                if (feedbackArea) {
                    if (selected.toString() === correctAnswer) {
                        quizState.score++;
                        user.stars += 20;
                        saveProfiles();
                        const starSpan = document.getElementById('star-count');
                        if (starSpan) starSpan.innerText = user.stars;
                        feedbackArea.innerHTML = `
                            <div class="bg-emerald-950 border border-emerald-800 p-4 rounded-2xl text-emerald-300 font-bold text-xs animate-fade-in mb-4">
                                <p class="font-black text-sm mb-1">✓ Jawaban Tepat!</p>
                                <p>${q.explanation}</p>
                            </div>
                        `;
                    } else {
                        feedbackArea.innerHTML = `
                            <div class="bg-amber-950 border border-amber-800 p-4 rounded-2xl text-amber-200 font-bold text-xs animate-fade-in mb-4">
                                <p class="font-black text-sm mb-1">💡 Belum Tepat</p>
                                <p>${q.hints ? q.hints[0] : 'Perhatikan kembali cara hitungnya.'}</p>
                            </div>
                        `;
                    }
                }
            } else {
                if (selected.toString() === correctAnswer) quizState.score++;
            }
        }

        function handleNextQuestion(isTimeOut = false) {
            if (quizState.timerInterval) {
                clearInterval(quizState.timerInterval);
                quizState.timerInterval = null;
            }

            if (!isTimeOut && !quizState.selectedOption && quizState.isExam) return;
            
            quizState.currentIndex++;
            quizState.selectedOption = null;
            quizState.timeLeft = 60;

            if (quizState.currentIndex < quizState.questions.length) {
                renderQuiz(document.getElementById('main-content'));
            } else {
                if (quizState.isExam) {
                    router('examResult');
                } else {
                    router('examIntro', activeLevelId);
                }
            }
        }

        function renderExamResult(container) {
            const percentage = Math.round((quizState.score / quizState.questions.length) * 100);
            const passed = percentage >= 80;
            const user = getActiveUser();

            if (passed) {
                if (!user.completedLevels.includes(activeLevelId)) user.completedLevels.push(activeLevelId);
                const nextLevel = activeLevelId + 1;
                if (nextLevel <= 10 && !user.unlockedLevels.includes(nextLevel)) user.unlockedLevels.push(nextLevel);
                user.stars += 100;

                const badgesMap = {
                    1: "⭐ Jagoan Penjumlahan", 2: "✖️ Master Perkalian", 3: "🍰 Ahli Pecahan", 4: "📐 Juara Bangun Datar",
                    5: "🚗 Pintar Kecepatan", 6: "🧠 Detektif Logika", 7: "🔢 Raja Pola Angka", 8: "📊 Ahli Data",
                    9: "🥇 Juara Matematika SD", 10: "🏆 GRAND MASTER SD CHAMPION"
                };
                if (badgesMap[activeLevelId] && !user.badges.includes(badgesMap[activeLevelId])) {
                    user.badges.push(badgesMap[activeLevelId]);
                }
                saveProfiles();
            }

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center text-center pb-28">
                    <div class="bg-slate-800 p-8 rounded-[2rem] shadow-2xl border border-slate-700">
                        <div class="text-6xl mb-3">${passed ? '🏆' : '💪'}</div>
                        <h2 class="text-xl font-black text-white mb-2">${passed ? 'HEBAT, UJIAN LULUS!' : 'BELUM LULUS'}</h2>
                        <p class="text-slate-300 font-medium mb-6 text-xs">${passed ? 'Kerja bagus! Kamu berhasil melewati ujian ini.' : 'Skor minimal kelulusan adalah 80. Ayo coba lagi!'}</p>
                        
                        <div class="bg-slate-900 p-5 rounded-2xl mb-6 border border-slate-700">
                            <span class="text-[10px] text-slate-400 font-black uppercase">Skor Kamu</span>
                            <div class="text-5xl font-black my-2 ${passed ? 'text-emerald-400' : 'text-amber-400'}">${percentage}</div>
                            <span class="text-xs font-bold text-slate-300">Benar ${quizState.score} dari 5 soal</span>
                        </div>

                        ${passed ? `
                            <button onclick="router('map')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                                KLAIM BINTANG & LANJUT ➔
                            </button>
                        ` : `
                            <button onclick="router('lesson', ${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                                ULANGI MATERI
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // --- SLIME MATH SHOOTER GAME LOGIC ---
        function renderSlimeHome(container) {
            const headerTitle = document.getElementById('header-title');
            if (headerTitle) headerTitle.innerText = "Slime Math Shooter";

            container.innerHTML = `
                <div class="p-5 animate-fade-in flex flex-col items-center text-center pb-28">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 rounded-3xl shadow-xl w-full border border-emerald-500/40 mb-6 text-white">
                        <div class="text-5xl mb-2 animate-bounce">🟢⚔️🧙‍♂️</div>
                        <h1 class="text-xl font-black text-amber-300">SLIME MATH SHOOTER</h1>
                        <p class="text-xs text-emerald-100 mt-1 font-semibold">Tembak monster slime dengan menghitung cepat sebelum mereka mendekat!</p>
                    </div>

                    <div class="w-full space-y-3">
                        <h3 class="text-xs font-black text-left text-slate-300 uppercase tracking-wider px-2">Pilih Level Game Slime:</h3>
                        
                        <div onclick="startSlimeLevel(1)" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-2xl border border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🟢</span>
                                <div class="text-left">
                                    <h4 class="font-black text-sm text-white">Level 1: Slime Hijau Ceria</h4>
                                    <p class="text-[11px] text-slate-400">Penjumlahan & Pengurangan (Waktu: 15s)</p>
                                </div>
                            </div>
                            <span class="text-amber-400 font-bold text-xs bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">MAIN ➔</span>
                        </div>

                        <div onclick="startSlimeLevel(2)" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-2xl border border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🔵</span>
                                <div class="text-left">
                                    <h4 class="font-black text-sm text-white">Level 2: Slime Biru Lincah</h4>
                                    <p class="text-[11px] text-slate-400">Perkalian Dasar (Waktu: 12s)</p>
                                </div>
                            </div>
                            <span class="text-amber-400 font-bold text-xs bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">MAIN ➔</span>
                        </div>

                        <div onclick="startSlimeLevel(3)" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-2xl border border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🟣</span>
                                <div class="text-left">
                                    <h4 class="font-black text-sm text-white">Level 3: Slime Ungu Master</h4>
                                    <p class="text-[11px] text-slate-400">Campuran Hitung (Waktu: 10s)</p>
                                </div>
                            </div>
                            <span class="text-amber-400 font-bold text-xs bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">MAIN ➔</span>
                        </div>

                        <div onclick="startSlimeLevel(4)" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-2xl border border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">👑</span>
                                <div class="text-left">
                                    <h4 class="font-black text-sm text-white">Level 4: Raja Slime Merah (Boss)</h4>
                                    <p class="text-[11px] text-slate-400">Tantangan Cepat SD (Waktu: 8s)</p>
                                </div>
                            </div>
                            <span class="text-amber-400 font-bold text-xs bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">MAIN ➔</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function startSlimeLevel(lvl) {
            const slimeTypes = [
                { name: 'Slime Hijau Ceria', emoji: '🟢', time: 15 },
                { name: 'Slime Biru Lincah', emoji: '🔵', time: 12 },
                { name: 'Slime Ungu Master', emoji: '🟣', time: 10 },
                { name: 'Raja Slime Merah', emoji: '👑', time: 8 }
            ];

            const type = slimeTypes[lvl - 1];
            slimeGameState = {
                level: lvl,
                questionIndex: 0,
                maxQuestions: 10,
                score: 0,
                hp: 3,
                timeLeft: type.time,
                maxTime: type.time,
                timerInterval: null,
                currentQ: null,
                slimeName: type.name,
                slimeEmoji: type.emoji,
                slimePos: 10
            };

            router('slimeArena');
        }

        function generateSlimeQuestion() {
            let qText = "";
            let correctAns = 0;
            let lvl = slimeGameState.level;

            if (lvl === 1) {
                let a = Math.floor(Math.random() * 30) + 5;
                let b = Math.floor(Math.random() * 30) + 5;
                if (Math.random() > 0.5) {
                    qText = `${a} + ${b} = ?`;
                    correctAns = a + b;
                } else {
                    if (a < b) [a, b] = [b, a];
                    qText = `${a} - ${b} = ?`;
                    correctAns = a - b;
                }
            } else if (lvl === 2) {
                let a = Math.floor(Math.random() * 9) + 2;
                let b = Math.floor(Math.random() * 9) + 2;
                qText = `${a} × ${b} = ?`;
                correctAns = a * b;
            } else if (lvl === 3) {
                let a = Math.floor(Math.random() * 10) + 2;
                let b = Math.floor(Math.random() * 5) + 2;
                let c = Math.floor(Math.random() * 10) + 1;
                qText = `(${a} + ${b}) - ${c} = ?`;
                correctAns = (a + b) - c;
            } else {
                let a = Math.floor(Math.random() * 10) + 5;
                let b = Math.floor(Math.random() * 5) + 2;
                let c = Math.floor(Math.random() * 10) + 5;
                qText = `(${a} × ${b}) - ${c} = ?`;
                correctAns = (a * b) - c;
            }

            let options = [correctAns];
            while (options.length < 3) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrong = correctAns + offset;
                if (wrong >= 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options = shuffleArray(options);

            return { q: qText, answer: correctAns, options: options };
        }

        function renderSlimeArena(container) {
            if (!slimeGameState.currentQ) {
                slimeGameState.currentQ = generateSlimeQuestion();
            }

            const headerTitle = document.getElementById('header-title');
            if (headerTitle) headerTitle.innerText = `Arena Slime (Level ${slimeGameState.level})`;

            if (!slimeGameState.timerInterval) {
                slimeGameState.timerInterval = setInterval(() => {
                    slimeGameState.timeLeft--;
                    const timerBar = document.getElementById('slime-timer-bar');
                    const timerText = document.getElementById('slime-timer-text');
                    if (timerBar && timerText) {
                        let pct = (slimeGameState.timeLeft / slimeGameState.maxTime) * 100;
                        timerBar.style.width = pct + '%';
                        timerText.innerText = slimeGameState.timeLeft + 's';
                    }

                    slimeGameState.slimePos += (50 / slimeGameState.maxTime);
                    const slimeEl = document.getElementById('slime-monster-div');
                    if (slimeEl) {
                        slimeEl.style.left = slimeGameState.slimePos + '%';
                    }

                    if (slimeGameState.timeLeft <= 0) {
                        handleSlimeWrongTimeout();
                    }
                }, 1000);
            }

            let q = slimeGameState.currentQ;
            let hpHearts = '❤️'.repeat(slimeGameState.hp) + '🖤'.repeat(3 - slimeGameState.hp);

            container.innerHTML = `
                <div class="p-4 flex flex-col min-h-[82vh] justify-between animate-fade-in text-white pb-28">
                    <div class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black text-amber-400">Level ${slimeGameState.level}</span>
                            <span class="text-xs text-slate-400">| Soal ${slimeGameState.questionIndex + 1}/10</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black text-emerald-400">⭐ ${slimeGameState.score}</span>
                            <span class="text-sm">${hpHearts}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-b from-slate-800 to-slate-900 rounded-3xl p-4 border border-slate-700 relative h-48 flex flex-col items-center justify-center overflow-hidden my-3 shadow-inner">
                        <div class="absolute top-2.5 left-4 right-4 bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div id="slime-timer-bar" class="bg-rose-500 h-full transition-all duration-1000" style="width: 100%"></div>
                        </div>
                        <span id="slime-timer-text" class="absolute top-5 text-[10px] font-black text-rose-400 uppercase tracking-widest">Waktu: ${slimeGameState.timeLeft}s</span>

                        <div id="slime-monster-div" class="absolute transition-all duration-500 flex flex-col items-center" style="left: ${slimeGameState.slimePos}%; top: 35%;">
                            <div class="text-4xl animate-bounce filter drop-shadow-[0_8px_6px_rgba(0,0,0,0.5)]">${slimeGameState.slimeEmoji}</div>
                            <span class="text-[9px] font-extrabold bg-slate-900/90 px-2 py-0.5 rounded border border-slate-700 text-slate-300 mt-1 whitespace-nowrap">${slimeGameState.slimeName}</span>
                        </div>

                        <div class="absolute left-[78%] top-[38%] flex flex-col items-center">
                            <div class="text-3xl animate-pulse">🧙‍♂️⚔️</div>
                            <span class="text-[9px] font-extrabold bg-slate-900/90 px-2 py-0.5 rounded border border-slate-700 text-amber-400 mt-1">Pahlawan</span>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-3xl p-4 border border-slate-700 shadow-sm text-center mb-2">
                        <span class="text-[10px] font-extrabold text-blue-400 uppercase tracking-widest bg-blue-950 px-3 py-1 rounded-full border border-blue-800 inline-block mb-2">Tembak Jawaban Benar!</span>
                        <h2 class="text-2xl font-black text-amber-300 mb-4 tracking-wide">${q.q}</h2>

                        <div class="grid grid-cols-3 gap-2.5">
                            ${q.options.map((opt) => `
                                <button onclick="handleSlimeAnswer(${opt})" class="p-3 bg-slate-900 hover:bg-blue-600 border border-slate-700 hover:border-blue-500 rounded-2xl font-black text-base text-white shadow transition-transform active:scale-95">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSlimeAnswer(chosen) {
            if (!slimeGameState.currentQ) return;
            clearInterval(slimeGameState.timerInterval);
            slimeGameState.timerInterval = null;

            let q = slimeGameState.currentQ;
            if (chosen === q.answer) {
                slimeGameState.score += 20;
                slimeGameState.slimePos = 10;
                nextSlimeTurn();
            } else {
                slimeGameState.hp--;
                slimeGameState.slimePos = Math.min(slimeGameState.slimePos + 18, 65);
                if (slimeGameState.hp <= 0) {
                    endSlimeGame(false);
                } else {
                    nextSlimeTurn();
                }
            }
        }

        function handleSlimeWrongTimeout() {
            clearInterval(slimeGameState.timerInterval);
            slimeGameState.timerInterval = null;
            slimeGameState.hp--;
            slimeGameState.slimePos = Math.min(slimeGameState.slimePos + 22, 65);
            if (slimeGameState.hp <= 0) {
                endSlimeGame(false);
            } else {
                nextSlimeTurn();
            }
        }

        function nextSlimeTurn() {
            slimeGameState.questionIndex++;
            if (slimeGameState.questionIndex >= slimeGameState.maxQuestions) {
                endSlimeGame(true);
            } else {
                slimeGameState.timeLeft = slimeGameState.maxTime;
                slimeGameState.currentQ = generateSlimeQuestion();
                router('slimeArena');
            }
        }

        function endSlimeGame(isWin) {
            if (slimeGameState.timerInterval) {
                clearInterval(slimeGameState.timerInterval);
                slimeGameState.timerInterval = null;
            }

            const user = getActiveUser();
            if (user && isWin) {
                user.stars += slimeGameState.score;
                if (!user.badges.includes("🛡️ Pahlawan Slime")) {
                    user.badges.push("🛡️ Pahlawan Slime");
                }
                saveProfiles();
            }

            router('slimeResult');
        }

        function renderSlimeResult(container) {
            let isWin = slimeGameState.hp > 0 && slimeGameState.questionIndex >= slimeGameState.maxQuestions;
            let finalScore = slimeGameState.score;

            const headerTitle = document.getElementById('header-title');
            if (headerTitle) headerTitle.innerText = "Hasil Pertempuran";

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center text-center min-h-[82vh] pb-28">
                    <div class="bg-slate-800 p-7 rounded-[2rem] shadow-2xl border border-slate-700">
                        <div class="text-6xl mb-3">${isWin ? '🏆' : '💀'}</div>
                        <h2 class="text-xl font-black text-white mb-2">${isWin ? 'KEMENANGAN GEMILANG!' : 'KALAH DITAKLUKKAN SLIME'}</h2>
                        <p class="text-slate-300 font-medium mb-5 text-xs">${isWin ? 'Hebat! Kamu berhasil mengalahkan monster slime dengan hitungan cepat.' : 'Slime berhasil mendekat. Ayo coba lagi dan lebih cepat!'}</p>
                        
                        <div class="bg-slate-900 p-4 rounded-2xl mb-5 border border-slate-700">
                            <span class="text-[10px] text-slate-400 font-black uppercase">Poin Didapat</span>
                            <div class="text-4xl font-black my-1 text-amber-400">+${finalScore}</div>
                            <span class="text-xs font-bold text-slate-300">⭐ Ditambahkan ke Bintangmu</span>
                        </div>

                        <div class="space-y-3">
                            <button onclick="router('slimeGame')" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                                PILIH LEVEL SLIME LAIN ➔
                            </button>
                            <button onclick="router('home')" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-3 rounded-2xl transition text-xs">
                                KEMBALI KE UTAMA
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = function () {
            if (profiles.length === 0) {
                router('profiles');
            } else {
                if (!currentUserId && profiles.length > 0) currentUserId = profiles[0].id;
                router('home');
            }
        };
    </script>
</body>
</html>
