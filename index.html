        // Fungsi Helper Acak Array
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Router Utama
        function router(viewName, levelId = null) {
            currentView = viewName;
            if (levelId !== null) activeLevelId = levelId;

            const header = document.getElementById('header-container');
            const nav = document.getElementById('bottom-nav');
            const main = document.getElementById('main-content');
            const starCountEl = document.getElementById('star-count');
            starCountEl.innerText = state.stars;

            // Atur Visibilitas Navigasi & Header
            if (['home', 'map', 'dashboard'].includes(viewName)) {
                nav.classList.remove('hidden');
                header.classList.add('hidden');
            } else {
                nav.classList.add('hidden');
                header.classList.remove('hidden');
                document.getElementById('btn-back').onclick = () => {
                    if (viewName === 'lesson' || viewName === 'examIntro') router('levelIntro', activeLevelId);
                    else if (viewName === 'levelIntro') router('map');
                    else if (viewName === 'practice' || viewName === 'exam') router('lesson', activeLevelId);
                    else router('map');
                };
            }

            // Highlight Active Nav
            ['home', 'map', 'dashboard'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                if (btn) {
                    if (id === viewName) {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-blue-600 transform scale-105 transition-all duration-300 font-bold";
                    } else {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-gray-400 transition-all duration-300";
                    }
                }
            });

            // Render Views
            main.innerHTML = '';
            if (viewName === 'home') renderHome(main);
            else if (viewName === 'map') renderMap(main);
            else if (viewName === 'dashboard') renderDashboard(main);
            else if (viewName === 'levelIntro') renderLevelIntro(main);
            else if (viewName === 'lesson') renderLesson(main);
            else if (viewName === 'examIntro') renderExamIntro(main);
            else if (viewName === 'practice' || viewName === 'exam') renderQuiz(main);
            else if (viewName === 'examResult') renderExamResult(main);
        }

                        <h2 class="text-blue-500 font-extrabold text-xs tracking-widest uppercase mb-1">${lvl.title}</h2>
                        <h1 class="text-2xl font-black text-gray-800 mb-3">${lvl.name}</h1>
                        <p class="text-gray-600 font-bold bg-gray-50 p-3 rounded-xl mb-6 text-sm">${lvl.desc}</p>
                        
                        <div class="bg-blue-50 p-4 rounded-2xl mb-6 text-left border border-blue-100">
                            <h4 class="font-black text-blue-900 text-sm mb-2">Target Misi:</h4>
                            <ul class="text-xs text-gray-700 space-y-2 font-bold">
                                <li>✓ Pahami Materi & Trik Jago</li>
                                <li>✓ Latihan 5 Soal Acak</li>
                                <li>✓ Lulus Ujian (Min. Skor 80)</li>
                            </ul>
                        </div>
                        <button onclick="router('lesson', ${lvl.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(37,99,235)] transition text-base">
                            ▶ MULAI MATERI
                        </button>
                    </div>
                </div>
            `;
        }

        // 5. LESSON VIEW (MATERI & TRIK)
        function renderLesson(container) {
            const lvl = LEVELS.find(l => l.id === activeLevelId);
            const data = CONTENT[activeLevelId].lesson;
            document.getElementById('header-title').innerText = "Materi";

            container.innerHTML = `
                <div class="p-5 pb-28 animate-fade-in space-y-5">
                    <div class="bg-white rounded-3xl p-6 border-2 border-gray-100 shadow-sm">
                        <span class="text-blue-600 font-extrabold text-[10px] tracking-widest uppercase bg-blue-50 px-3 py-1 rounded-lg">Konsep</span>
                        <h3 class="text-xl font-black text-gray-900 mt-2 mb-3">${data.title}</h3>
                        <p class="text-gray-700 font-bold text-sm leading-relaxed">${data.concept}</p>
                    </div>

                    <div class="bg-gradient-to-br from-orange-400 to-yellow-400 rounded-3xl p-1.5 shadow-md">
                        <div class="bg-white rounded-[1.3rem] p-5">
                            <h3 class="text-orange-600 font-black mb-2 text-sm uppercase">💡 TRIK JAGO</h3>
                            <p class="text-gray-800 font-bold text-sm">${data.trick}</p>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-gray-100 rounded-3xl p-5 shadow-sm">
                        <h3 class="text-gray-400 font-extrabold text-xs uppercase mb-3 border-b pb-2">Contoh Soal</h3>
                        <div class="bg-blue-50 p-4 rounded-xl mb-4 font-bold text-blue-900 text-sm">${data.q}</div>
                        <div class="space-y-2 text-xs font-bold text-gray-700">
                            <p>💭 <em>"${data.think}"</em></p>
                            <p>1️⃣ ${data.step1}</p>
                            <p>2️⃣ ${data.step2}</p>
                            <div class="mt-3 bg-green-50 text-green-800 p-3 rounded-xl border border-green-200 font-black">
                                ✓ ${data.ans}
                            </div>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t flex justify-center max-w-md mx-auto z-40">
                        <button onclick="startPractice(${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(37,99,235)] transition text-base">
                            COBA LATIHAN ACAK ➔
                        </button>
                    </div>
                </div>
            `;
        }

        // 6. QUIZ / EXAM ENGINE (RANDOMIZER PENUH TANPA BUG)
        function startPractice(levelId) {
            quizState = {
                isExam: false,
                questions: shuffleArray(CONTENT[levelId].practicePool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintShownCount: 0,
                mistakeCount: 0
            };
            router('practice');
        }

        function startExamIntro(levelId) {
            router('examIntro');
        }

        function renderExamIntro(container) {
            const lvl = LEVELS.find(l => l.id === activeLevelId);
            document.getElementById('header-title').innerText = "Ujian Level";

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center">
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-4 border-orange-200 text-center">
                        <div class="w-20 h-20 mx-auto rounded-full bg-orange-100 flex items-center justify-center text-3xl mb-4 text-orange-500 shadow">🎯</div>
                        <h2 class="text-2xl font-black text-gray-800 mb-2">Ujian ${lvl.title}</h2>
                        <p class="text-gray-600 font-bold mb-6 text-sm">Buktikan kemampuanmu dengan 5 soal acak tanpa bantuan Hint.</p>
                        
                        <div class="bg-orange-50 p-4 rounded-2xl mb-6 text-left border border-orange-100 text-xs font-bold text-orange-900 space-y-2">
                            <p>• Tidak ada tombol petunjuk.</p>
                            <p>• Skor minimal untuk lulus adalah 80.</p>
                        </div>

                        <button onclick="launchExam()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(249,115,22)] transition text-base">
                            ⚡ MULAI UJIAN SEKARANG
                        </button>
                    </div>
                </div>
            `;
        }

        function launchExam() {
            quizState = {
                isExam: true,
                questions: shuffleArray(CONTENT[activeLevelId].examPool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintShownCount: 0,
                mistakeCount: 0
            };
            router('exam');
        }

        function renderQuiz(container) {
            const isExam = quizState.isExam;
            const q = quizState.questions[quizState.currentIndex];
            document.getElementById('header-title').innerText = isExam ? "Ujian" : "Latihan";

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleOptionSelect('${opt.replace(/'/g, "\\'")}')" id="opt-btn-${idx}" class="w-full p-4 rounded-2xl font-bold text-left text-base border-2 border-gray-200 bg-white hover:border-blue-400 transition shadow-sm">
                        <span class="opacity-60 mr-2">${String.fromCharCode(65 + idx)}.</span> ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="p-5 pb-32 animate-fade-in flex flex-col">
                    <div class="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden shadow-inner">
                        <div class="bg-blue-600 h-2 transition-all duration-300" style="width: ${((quizState.currentIndex) / quizState.questions.length) * 100}%"></div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm mb-6">
                        <span class="text-xs font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg uppercase">Soal ${quizState.currentIndex + 1} dari 5</span>
                        <h3 class="text-lg font-black text-gray-900 mt-4 mb-6 leading-relaxed">${isExam ? q.q : q.question}</h3>
                        <div class="space-y-3" id="options-container">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div id="feedback-area"></div>
                </div>

                <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t flex justify-center max-w-md mx-auto z-40">
                    <button id="btn-next-quiz" onclick="handleNextQuestion()" disabled class="w-full bg-gray-200 text-gray-400 font-extrabold py-3.5 rounded-2xl transition text-base cursor-not-allowed">
                        ${quizState.currentIndex === quizState.questions.length - 1 ? 'SELESAI' : 'LANJUT SOAL ➔'}
                    </button>
                </div>
            `;
        }

        function handleOptionSelect(selected) {
            quizState.selectedOption = selected;
            const q = quizState.questions[quizState.currentIndex];
            const isExam = quizState.isExam;
            const correctAnswer = isExam ? q.a : q.answer;

            // Update UI Tombol Pilihan
            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`opt-btn-${idx}`);
                btn.disabled = true;
                if (opt === correctAnswer) {
                    btn.className = "w-full p-4 rounded-2xl font-bold text-left text-base border-2 border-green-500 bg-green-500 text-white shadow";
                } else if (opt === selected) {
                    btn.className = "w-full p-4 rounded-2xl font-bold text-left text-base border-2 border-red-400 bg-red-50 text-red-700";
                } else {
                    btn.className = "w-full p-4 rounded-2xl font-bold text-left text-base border-2 border-gray-200 opacity-50 bg-white";
                }
            });

            const nextBtn = document.getElementById('btn-next-quiz');
            nextBtn.disabled = false;
            nextBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(37,99,235)] transition text-base cursor-pointer";

            if (!isExam) {
                const feedbackArea = document.getElementById('feedback-area');
                if (selected === correctAnswer) {
                    quizState.score++;
                    state.stars += 10;
                    saveState();
                    document.getElementById('star-count').innerText = state.stars;
                    feedbackArea.innerHTML = `
                        <div class="bg-green-50 p-4 rounded-2xl border border-green-200 text-green-900 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">✓ Jawaban Tepat!</p>
                            <p>${q.explanation}</p>
                        </div>
                    `;
                } else {
                    quizState.mistakeCount++;
                    feedbackArea.innerHTML = `
                        <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200 text-orange-900 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">💡 Belum Tepat</p>
                            <p>${q.hints ? q.hints[0] : 'Coba perhatikan kembali rumusnya ya.'}</p>
                        </div>
                    `;
                }
            } else {
                if (selected === correctAnswer) {
                    quizState.score++;
                }
            }
        }

        function handleNextQuestion() {
            if (!quizState.selectedOption) return;

            quizState.currentIndex++;
            quizState.selectedOption = null;

            if (quizState.currentIndex < quizState.questions.length) {
                renderQuiz(document.getElementById('main-content'));
            } else {
                if (quizState.isExam) {
                    router('examResult');
                } else {
                    router('examIntro', activeLevelId);
                }
            }
        }

        // 7. EXAM RESULT & UNLOCK SYSTEM
        function renderExamResult(container) {
            const percentage = Math.round((quizState.score / quizState.questions.length) * 100);
            const passed = percentage >= 80;

            if (passed) {
                if (!state.completedLevels.includes(activeLevelId)) {
                    state.completedLevels.push(activeLevelId);
                }
                const nextLevel = activeLevelId + 1;
                if (nextLevel <= 10 && !state.unlockedLevels.includes(nextLevel)) {
                    state.unlockedLevels.push(nextLevel);
                }
                state.stars += 50;
                
                // Tambah Badge
                const badgesMap = { 1: "🌟 Pemula Hebat", 2: "🔢 Penakluk Angka", 3: "🍕 Master Pecahan", 4: "🧠 Detektif Logika", 5: "📐 Raja Bangun", 6: "⚡ Master Cepat", 7: "🎲 Ahli Kombinasi", 8: "💡 Pemikir Jenius", 9: "🔥 Penantang Elite", 10: "🏆 OLYMPIAD MASTER" };
                if (badgesMap[activeLevelId] && !state.badges.includes(badgesMap[activeLevelId])) {
                    state.badges.push(badgesMap[activeLevelId]);
                }
                saveState();
            }

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center text-center">
                    <div class="bg-white p-8 rounded-[2rem] shadow-2xl border-4 border-blue-100">
                        <div class="text-6xl mb-4">${passed ? '🏆' : '💪'}</div>
                        <h2 class="text-2xl font-black text-gray-800 mb-2">${passed ? 'LULUS LEVEL!' : 'JANGAN MENYERAH!'}</h2>
                        <p class="text-gray-600 font-bold mb-6 text-xs">${passed ? 'Luar biasa! Level selanjutnya telah terbuka.' : 'Skor minimal lulus adalah 80. Ayo pelajari kembali materinya.'}</p>
                        
                        <div class="bg-gray-50 p-5 rounded-2xl mb-6 border">
                            <span class="text-xs font-black text-gray-400 uppercase">Skor Akhir</span>
                            <div class="text-5xl font-black my-1 ${passed ? 'text-green-500' : 'text-orange-500'}">${percentage}</div>
                            <span class="text-xs font-bold text-gray-600">Benar ${quizState.score} dari 5 soal</span>
                        </div>

                        ${passed ? `
                            <button onclick="router('map')" class="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(34,197,94)] transition text-base">
                                KLAIM & LANJUT KE PETA ➔
                            </button>
                        ` : `
                            <button onclick="router('lesson', ${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(37,99,235)] transition text-base">
                                PELAJARI MATERI LAGI
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // Inisialisasi awal saat halaman dimuat
        window.onload = () => {
            router('home');
        };
    </script>
</body>
</html>
