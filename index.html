        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function router(viewName, levelId = null) {
            // Cek apakah ada user aktif jika masuk ke menu utama/map
            if (viewName !== 'profiles' && !getActiveUser()) {
                currentView = 'profiles';
            } else {
                currentView = viewName;
            }

            if (levelId !== null) activeLevelId = levelId;

            const header = document.getElementById('header-container');
            const nav = document.getElementById('bottom-nav');
            const main = document.getElementById('main-content');
            const user = getActiveUser();

            if (user) {
                document.getElementById('current-user-name').innerText = user.name;
                document.getElementById('star-count').innerText = user.stars;
            }

            if (['home', 'map', 'dashboard'].includes(currentView)) {
                nav.classList.remove('hidden');
                header.classList.remove('hidden');
            } else if (currentView === 'profiles') {
                nav.classList.add('hidden');
                header.classList.add('hidden');
            } else {
                nav.classList.add('hidden');
                header.classList.remove('hidden');
                document.getElementById('btn-back').onclick = () => {
                    if (currentView === 'lesson' || currentView === 'examIntro') router('levelIntro', activeLevelId);
                    else if (currentView === 'levelIntro') router('map');
                    else if (currentView === 'practice' || currentView === 'exam') router('lesson', activeLevelId);
                    else router('map');
                };
            }

            ['home', 'map', 'profiles', 'dashboard'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                if (btn) {
                    if (id === currentView) {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-blue-600 transform scale-105 transition-all duration-300 font-bold";
                    } else {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-slate-400 transition-all duration-300";
                    }
                }
            });

            main.innerHTML = '';
            if (currentView === 'profiles') renderProfiles(main);
            else if (currentView === 'home') renderHome(main);
            else if (currentView === 'map') renderMap(main);
            else if (currentView === 'dashboard') renderDashboard(main);
            else if (currentView === 'levelIntro') renderLevelIntro(main);
            else if (currentView === 'lesson') renderLesson(main);
            else if (currentView === 'examIntro') renderExamIntro(main);
            else if (currentView === 'practice' || currentView === 'exam') renderQuiz(main);
            else if (currentView === 'examResult') renderExamResult(main);
        }

        function createNewProfile() {
            const input = document.getElementById('new-profile-name');
            const name = input.value.trim();
            if (!name) return alert('Nama tidak boleh kosong!');

            const newId = 'user_' + Date.now();
            profiles.push({
                id: newId,
                name: name,
                stars: 0,
                completedLevels: [],
                unlockedLevels: [1],
                badges: []
            });
            currentUserId = newId;
            saveProfiles();
            router('home');
        }

            currentUserId = id;

            if (!confirm('Yakin ingin menghapus profil ini? Semua poin akan terhapus.')) return;
            profiles = profiles.filter(p => p.id !== id);
            if (currentUserId === id) {
                currentUserId = profiles.length > 0 ? profiles[0].id : null;

            router('profiles');
        }

                            <span class="text-3xl mb-1">🔥</span>
                            <span class="text-3xl font-extrabold text-orange-700">${user.completedLevels.length}</span>
                            <span class="text-[10px] font-black text-orange-600 uppercase mt-1">Level Selesai</span>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6">
                        <h3 class="font-bold text-slate-800 text-sm mb-3">Kemajuan Total (10 Level)</h3>
                        <div class="flex justify-between text-xs font-medium text-slate-600 mb-2">
                            <span>Pencapaian</span>
                            <span class="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">${Math.round((user.completedLevels.length / 10) * 100)}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden shadow-inner">
                            <div class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: ${(user.completedLevels.length / 10) * 100}%"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-800 text-sm mb-3">🏆 Koleksi Badge Olimpiade</h3>
                        <div class="flex flex-wrap gap-2">
                            ${user.badges.length > 0 ? user.badges.map(b => `<span class="bg-indigo-50 text-indigo-900 px-3 py-1.5 rounded-xl text-xs font-black border border-indigo-200">${b}</span>`).join('') : '<p class="text-xs text-slate-400 italic">Belum ada badge. Selesaikan level untuk meraih prestasi!</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLevelIntro(container) {
            const lvl = LEVELS.find(l => l.id === activeLevelId);
            document.getElementById('header-title').innerText = lvl.title;

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center">
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-4 border-blue-100 text-center">
                        <div class="w-20 h-20 mx-auto rounded-full ${lvl.color} text-white flex items-center justify-center text-2xl font-black mb-4 shadow">
                            ${lvl.id}
                        </div>
                        <h2 class="text-blue-500 font-extrabold text-xs tracking-widest uppercase mb-1">${lvl.title}</h2>
                        <h1 class="text-xl font-black text-slate-800 mb-3">${lvl.name}</h1>
                        <p class="text-slate-600 font-bold bg-slate-50 p-3 rounded-xl mb-6 text-xs">${lvl.desc}</p>
                        
                        <div class="bg-blue-50 p-4 rounded-2xl mb-6 text-left border border-blue-100">
                            <h4 class="font-black text-blue-900 text-xs mb-2">Target Misi:</h4>
                            <ul class="text-xs text-slate-700 space-y-2 font-bold">
                                <li>✓ Memahami Konsep & Trik Cepat</li>
                                <li>✓ Menyelesaikan 5 Latihan Soal Acak</li>
                                <li>✓ Lulus Ujian Evaluasi (Skor Min. 80)</li>
                            </ul>
                        </div>
                        <button onclick="router('lesson', ${lvl.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(37,99,235)] transition text-sm">
                            ▶ MULAI MATERI
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLesson(container) {
            const data = CONTENT[activeLevelId].lesson;
            document.getElementById('header-title').innerText = "Materi";

            container.innerHTML = `
                <div class="p-5 pb-28 animate-fade-in space-y-5">
                    <div class="bg-white rounded-3xl p-6 border-2 border-slate-100 shadow-sm">
                        <span class="text-blue-600 font-extrabold text-[10px] tracking-widest uppercase bg-blue-50 px-3 py-1 rounded-lg">Konsep</span>
                        <h3 class="text-lg font-black text-slate-900 mt-2 mb-3">${data.title}</h3>
                        <p class="text-slate-700 font-bold text-xs leading-relaxed">${data.concept}</p>
                    </div>

                    <div class="bg-gradient-to-br from-orange-400 to-yellow-400 rounded-3xl p-1.5 shadow-md">
                        <div class="bg-white rounded-[1.3rem] p-5">
                            <h3 class="text-orange-600 font-black mb-2 text-xs uppercase">💡 TRIK JAGO OLIMPIADE</h3>
                            <p class="text-slate-800 font-bold text-xs">${data.trick}</p>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-slate-100 rounded-3xl p-5 shadow-sm">
                        <h3 class="text-slate-400 font-extrabold text-[10px] uppercase mb-3 border-b pb-2">Contoh Pembahasan</h3>
                        <div class="bg-blue-50 p-4 rounded-xl mb-4 font-bold text-blue-900 text-xs">${data.q}</div>
                        <div class="space-y-2 text-xs font-bold text-slate-700">
                            <p>💭 <em>"${data.think}"</em></p>
                            <p>1️⃣ ${data.step1}</p>
                            <p>2️⃣ ${data.step2}</p>
                            <div class="mt-3 bg-emerald-50 text-emerald-800 p-3 rounded-xl border border-emerald-200 font-black">
                                ✓ ${data.ans}
                            </div>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t flex justify-center max-w-md mx-auto z-40">
                        <button onclick="startPractice(${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(37,99,235)] transition text-sm">
                            COBA LATIHAN ACAK ➔
                        </button>
                    </div>
                </div>
            `;
        }

        function startPractice(levelId) {
            quizState = {
                isExam: false,
                questions: shuffleArray(CONTENT[levelId].practicePool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintShownCount: 0,
                mistakeCount: 0
            };
            router('practice');
        }

        function renderExamIntro(container) {
            const lvl = LEVELS.find(l => l.id === activeLevelId);
            document.getElementById('header-title').innerText = "Ujian Level";

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center">
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-4 border-orange-200 text-center">
                        <div class="w-20 h-20 mx-auto rounded-full bg-orange-100 flex items-center justify-center text-2xl mb-4 text-orange-500 shadow">🎯</div>
                        <h2 class="text-xl font-black text-slate-800 mb-2">Ujian Evaluasi ${lvl.title}</h2>
                        <p class="text-slate-600 font-bold mb-6 text-xs">Jawab 5 soal acak dengan benar untuk membuka level berikutnya!</p>
                        
                        <div class="bg-orange-50 p-4 rounded-2xl mb-6 text-left border border-orange-100 text-xs font-bold text-orange-900 space-y-2">
                            <p>• Tanpa tombol bantuan (Hint).</p>
                            <p>• Nilai minimal kelulusan adalah 80.</p>
                        </div>

                        <button onclick="launchExam()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-4 rounded-2xl shadow-[0_6px_0_rgb(249,115,22)] transition text-sm">
                            ⚡ MULAI UJIAN SEKARANG
                        </button>
                    </div>
                </div>
            `;
        }

        function launchExam() {
            quizState = {
                isExam: true,
                questions: shuffleArray(CONTENT[activeLevelId].examPool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintShownCount: 0,
                mistakeCount: 0
            };
            router('exam');
        }

        function renderQuiz(container) {
            const isExam = quizState.isExam;
            const q = quizState.questions[quizState.currentIndex];
            document.getElementById('header-title').innerText = isExam ? "Ujian Evaluasi" : "Latihan Soal";

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleOptionSelect('${opt.replace(/'/g, "\\'")}')" id="opt-btn-${idx}" class="w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border-2 border-slate-200 bg-white hover:border-blue-400 transition shadow-sm">
                        <span class="opacity-60 mr-2">${String.fromCharCode(65 + idx)}.</span> ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="p-5 pb-32 animate-fade-in flex flex-col">
                    <div class="w-full bg-slate-200 h-2 rounded-full mb-6 overflow-hidden shadow-inner">
                        <div class="bg-blue-600 h-2 transition-all duration-300" style="width: ${((quizState.currentIndex) / quizState.questions.length) * 100}%"></div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm mb-6">
                        <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg uppercase">Soal ${quizState.currentIndex + 1} dari 5</span>
                        <h3 class="text-sm sm:text-base font-black text-slate-900 mt-4 mb-6 leading-relaxed">${isExam ? q.q : q.question}</h3>
                        <div class="space-y-3" id="options-container">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div id="feedback-area"></div>
                </div>

                <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t flex justify-center max-w-md mx-auto z-40">
                    <button id="btn-next-quiz" onclick="handleNextQuestion()" disabled class="w-full bg-slate-200 text-slate-400 font-extrabold py-3.5 rounded-2xl transition text-sm cursor-not-allowed">
                        ${quizState.currentIndex === quizState.questions.length - 1 ? 'SELESAI' : 'LANJUT SOAL ➔'}
                    </button>
                </div>
            `;
        }

        function handleOptionSelect(selected) {
            quizState.selectedOption = selected;
            const q = quizState.questions[quizState.currentIndex];
            const isExam = quizState.isExam;
            const correctAnswer = isExam ? q.a : q.answer;
            const user = getActiveUser();

            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`opt-btn-${idx}`);
                btn.disabled = true;
                if (opt === correctAnswer) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border-2 border-emerald-500 bg-emerald-500 text-white shadow";
                } else if (opt === selected) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border-2 border-rose-400 bg-rose-50 text-rose-700";
                } else {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border-2 border-slate-200 opacity-50 bg-white";
                }
            });

            const nextBtn = document.getElementById('btn-next-quiz');
            nextBtn.disabled = false;
            nextBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(37,99,235)] transition text-sm cursor-pointer";

            if (!isExam) {
                const feedbackArea = document.getElementById('feedback-area');
                if (selected === correctAnswer) {
                    quizState.score++;
                    user.stars += 10;
                    saveProfiles();
                    document.getElementById('star-count').innerText = user.stars;
                    feedbackArea.innerHTML = `
                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 text-emerald-900 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">✓ Jawaban Tepat!</p>
                            <p>${q.explanation}</p>
                        </div>
                    `;
                } else {
                    feedbackArea.innerHTML = `
                        <div class="bg-orange-50 p-4 rounded-2xl border border-orange-200 text-orange-900 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">💡 Belum Tepat</p>
                            <p>${q.hints ? q.hints[0] : 'Perhatikan kembali langkah penyelesaiannya.'}</p>
                        </div>
                    `;
                }
            } else {
                if (selected === correctAnswer) {
                    quizState.score++;
                }
            }
        }

        function handleNextQuestion() {
            if (!quizState.selectedOption) return;

            quizState.currentIndex++;
            quizState.selectedOption = null;

            if (quizState.currentIndex < quizState.questions.length) {
                renderQuiz(document.getElementById('main-content'));
            } else {
                if (quizState.isExam) {
                    router('examResult');
                } else {
                    router('examIntro', activeLevelId);
                }
            }
        }

        function renderExamResult(container) {
            const percentage = Math.round((quizState.score / quizState.questions.length) * 100);
            const passed = percentage >= 80;
            const user = getActiveUser();

            if (passed) {
                if (!user.completedLevels.includes(activeLevelId)) {
                    user.completedLevels.push(activeLevelId);
                }
                const nextLevel = activeLevelId + 1;
                if (nextLevel <= 10 && !user.unlockedLevels.includes(nextLevel)) {
                    user.unlockedLevels.push(nextLevel);
                }
                user.stars += 50;
                
                const badgesMap = { 
                    1: "🏅 Master Pola SD 1-3", 2: "⚡ Kilat Hitung", 3: "🍕 Master Piza", 4: "🧠 Detektif Cilik", 5: "📐 Geometri Junior",
                    6: "👑 Juara Prima", 7: "📊 Ahli Persen", 8: "🏎️ King of Speed", 9: "🔄 Master Mundur", 10: "🏆 OSN MASTER SD" 
                };
                if (badgesMap[activeLevelId] && !user.badges.includes(badgesMap[activeLevelId])) {
                    user.badges.push(badgesMap[activeLevelId]);
                }
                saveProfiles();
            }

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center text-center">
                    <div class="bg-white p-8 rounded-[2rem] shadow-2xl border-4 border-blue-100">
                        <div class="text-5xl mb-3">${passed ? '🏆' : '💪'}</div>
                        <h2 class="text-xl font-black text-slate-800 mb-1">${passed ? 'LULUS UJIAN!' : 'COBA LAGI!'}</h2>
                        <p class="text-slate-600 font-bold mb-6 text-xs">${passed ? 'Hebat! Level berikutnya telah terbuka di peta.' : 'Syarat lulus minimal skor 80. Pelajari materinya kembali ya.'}</p>
                        
                        <div class="bg-slate-50 p-5 rounded-2xl mb-6 border">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Skor Akhir</span>
                            <div class="text-4xl font-black my-1 ${passed ? 'text-emerald-500' : 'text-orange-500'}">${percentage}</div>
                            <span class="text-xs font-bold text-slate-600">Benar ${quizState.score} dari 5 soal</span>
                        </div>

                        ${passed ? `
                            <button onclick="router('map')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(16,185,129)] transition text-sm">
                                KLAIM & LANJUT KE PETA ➔
                            </button>
                        ` : `
                            <button onclick="router('lesson', ${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow-[0_4px_0_rgb(37,99,235)] transition text-sm">
                                ULANGI MATERI & LATIHAN
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            if (profiles.length === 0) {
                router('profiles');
            } else {
                if (!currentUserId && profiles.length > 0) currentUserId = profiles[0].id;
                router('home');
            }
        };
    </script>
</body>
</html>
