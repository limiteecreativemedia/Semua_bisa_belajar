        let profiles = JSON.parse(localStorage.getItem('sbb_imo_profiles')) || [];
        let currentUserId = localStorage.getItem('sbb_imo_current_user') || null;

        function getActiveUser() {
            return profiles.find(p => p.id === currentUserId) || null;
        }

        function saveProfiles() {
            localStorage.setItem('sbb_imo_profiles', JSON.stringify(profiles));
            localStorage.setItem('sbb_imo_current_user', currentUserId);
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function router(viewName, levelId = null) {
            if (viewName !== 'profiles' && !getActiveUser()) {
                currentView = 'profiles';
            } else {
                currentView = viewName;
            }

            if (levelId !== null) activeLevelId = levelId;

            const header = document.getElementById('header-container');
            const nav = document.getElementById('bottom-nav');
            const main = document.getElementById('main-content');
            const user = getActiveUser();

            if (user) {
                document.getElementById('current-user-name').innerText = user.name;
                document.getElementById('star-count').innerText = user.stars;
            }

            if (['home', 'map', 'dashboard'].includes(currentView)) {
                nav.classList.remove('hidden');
                header.classList.remove('hidden');
            } else if (currentView === 'profiles') {
                nav.classList.add('hidden');
                header.classList.add('hidden');
            } else {
                nav.classList.add('hidden');
                header.classList.remove('hidden');
                document.getElementById('btn-back').onclick = () => {
                    if (currentView === 'lesson' || currentView === 'examIntro') router('levelIntro', activeLevelId);
                    else if (currentView === 'levelIntro') router('map');
                    else if (currentView === 'practice' || currentView === 'exam') router('lesson', activeLevelId);
                    else router('map');
                };
            }

            ['home', 'map', 'dashboard', 'profiles'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                if (btn) {
                    if (id === currentView) {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-amber-400 font-bold transform scale-105 transition";
                    } else {
                        btn.className = "flex flex-col items-center p-2 rounded-xl text-slate-400 transition";
                    }
                }
            });

            main.innerHTML = '';
            if (currentView === 'profiles') renderProfiles(main);
            else if (currentView === 'home') renderHome(main);
            else if (currentView === 'map') renderMap(main);
            else if (currentView === 'dashboard') renderDashboard(main);
            else if (currentView === 'levelIntro') renderLevelIntro(main);
            else if (currentView === 'lesson') renderLesson(main);
            else if (currentView === 'examIntro') renderExamIntro(main);
            else if (currentView === 'practice' || currentView === 'exam') renderQuiz(main);
            else if (currentView === 'examResult') renderExamResult(main);
        }

        function createNewProfile() {
            const input = document.getElementById('new-profile-name');
            const name = input.value.trim();
            if (!name) return alert('Nama tidak boleh kosong!');

            const newId = 'user_' + Date.now();
            profiles.push({
                id: newId,
                name: name,
                stars: 0,
                completedLevels: [],
                unlockedLevels: [1],
                badges: []
            });
            currentUserId = newId;
            saveProfiles();
            router('home');
        }

        function selectProfile(id) {
            currentUserId = id;
            saveProfiles();
            router('home');
        }

        function deleteProfile(id) {
            if (!confirm('Yakin ingin menghapus profil ini?')) return;
            profiles = profiles.filter(p => p.id !== id);
            if (currentUserId === id) currentUserId = profiles.length > 0 ? profiles[0].id : null;
            saveProfiles();
            router('profiles');
        }

                        <h2 class="text-amber-400 font-extrabold text-xs tracking-widest uppercase mb-1">${lvl.title}</h2>
                        <h1 class="text-xl font-black text-white mb-3">${lvl.name}</h1>
                        <p class="text-slate-300 font-semibold bg-slate-900 p-3 rounded-xl mb-6 text-xs">${lvl.desc}</p>
                        
                        <div class="bg-slate-900 p-4 rounded-2xl mb-6 text-left border border-slate-700 text-xs space-y-2">
                            <p class="font-bold text-blue-400">Silabus & Materi Inti:</p>
                            <p class="text-slate-300">${lesson.concept}</p>
                        </div>
                        <button onclick="router('lesson', ${lvl.id})" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                            ▶ BUKA MATERI & TRIK
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLesson(container) {
            const lesson = CONTENT[activeLevelId].lesson;
            document.getElementById('header-title').innerText = "Materi & Trik";

            container.innerHTML = `
                <div class="p-5 pb-28 animate-fade-in space-y-5">
                    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-sm">
                        <span class="text-blue-400 font-extrabold text-[10px] uppercase bg-blue-950 px-2.5 py-1 rounded-lg border border-blue-800">Konsep Utama</span>
                        <h3 class="text-lg font-black text-white mt-2 mb-2">${lesson.title}</h3>
                        <p class="text-slate-300 font-medium text-xs leading-relaxed">${lesson.concept}</p>
                    </div>

                    <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl p-1 shadow-lg">
                        <div class="bg-slate-900 rounded-[1.4rem] p-5">
                            <h3 class="text-amber-400 font-black mb-2 text-xs uppercase">💡 TIP & TRIK OLYMPIAD</h3>
                            <p class="text-slate-200 font-bold text-xs leading-relaxed">${lesson.trick}</p>
                        </div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-sm">
                        <h3 class="text-slate-400 font-extrabold text-[10px] uppercase mb-3 border-b border-slate-700 pb-2">Contoh Soal Pembahasan</h3>
                        <div class="bg-slate-900 p-3.5 rounded-xl mb-3 border border-slate-700 font-bold text-blue-300 text-xs">${lesson.examples[0].q}</div>
                        <div class="space-y-2 text-xs text-slate-300">
                            <p>💭 <em>"${lesson.examples[0].think}"</em></p>
                            <p>1. ${lesson.examples[0].step1}</p>
                            <p>2. ${lesson.examples[0].step2}</p>
                            <div class="mt-3 bg-emerald-950 text-emerald-300 p-3 rounded-xl border border-emerald-800 font-black">
                                ✓ ${lesson.examples[0].ans}
                            </div>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/90 backdrop-blur border-t border-slate-800 flex justify-center max-w-md mx-auto z-40">
                        <button onclick="startPractice(${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow transition text-xs flex justify-center items-center gap-2">
                            MULAI LATIHAN SOAL ACAK ➔
                        </button>
                    </div>
                </div>
            `;
        }

        function startPractice(levelId) {
            quizState = {
                isExam: false,
                questions: shuffleArray(CONTENT[levelId].practicePool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintLevel: 0,
                mistakes: 0
            };
            router('practice');
        }

        function renderExamIntro(container) {
            const lvl = LEVELS.find(l => l.id === activeLevelId);
            document.getElementById('header-title').innerText = "Ujian Evaluasi";

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center">
                    <div class="bg-slate-800 p-7 rounded-[2rem] shadow-xl border border-slate-700 text-center">
                        <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center text-2xl mb-4 shadow">🎯</div>
                        <h2 class="text-xl font-black text-white mb-2">Ujian Level ${lvl.id}</h2>
                        <p class="text-slate-300 font-medium mb-6 text-xs">Jawab 5 soal ujian dengan benar (Min. Nilai 80) untuk membuka level selanjutnya.</p>
                        <button onclick="launchExam()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                            ⚡ MULAI UJIAN SEKARANG
                        </button>
                    </div>
                </div>
            `;
        }

        function launchExam() {
            quizState = {
                isExam: true,
                questions: shuffleArray(CONTENT[activeLevelId].examPool).slice(0, 5),
                currentIndex: 0,
                score: 0,
                selectedOption: null,
                hintLevel: 0,
                mistakes: 0
            };
            router('exam');
        }

        function renderQuiz(container) {
            const isExam = quizState.isExam;
            const q = quizState.questions[quizState.currentIndex];
            document.getElementById('header-title').innerText = isExam ? "Ujian Level" : "Latihan Soal";

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleOptionSelect('${opt.replace(/'/g, "\\'")}')" id="opt-btn-${idx}" class="w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-slate-700 bg-slate-900 text-slate-200 hover:border-blue-500 transition">
                        <span class="opacity-60 mr-2">${String.fromCharCode(65 + idx)}.</span> ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="p-5 pb-32 animate-fade-in flex flex-col">
                    <div class="w-full bg-slate-800 h-2 rounded-full mb-5 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-500 to-amber-500 h-2 transition-all duration-300" style="width: ${((quizState.currentIndex) / quizState.questions.length) * 100}%"></div>
                    </div>

                    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-sm mb-5">
                        <span class="text-[10px] font-black text-blue-400 bg-blue-950 border border-blue-800 px-2.5 py-1 rounded-lg">Soal ${quizState.currentIndex + 1} / 5</span>
                        <h3 class="text-sm sm:text-base font-black text-white mt-3 mb-5 leading-relaxed">${isExam ? q.q : q.question}</h3>
                        <div class="space-y-3" id="options-container">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div id="feedback-area"></div>
                </div>

                <div class="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/90 backdrop-blur border-t border-slate-800 flex justify-center max-w-md mx-auto z-40">
                    <button id="btn-next-quiz" onclick="handleNextQuestion()" disabled class="w-full bg-slate-800 text-slate-500 font-extrabold py-3.5 rounded-2xl transition text-xs cursor-not-allowed">
                        ${quizState.currentIndex === quizState.questions.length - 1 ? 'SELESAI' : 'LANJUT SOAL ➔'}
                    </button>
                </div>
            `;
        }

        function handleOptionSelect(selected) {
            quizState.selectedOption = selected;
            const q = quizState.questions[quizState.currentIndex];
            const isExam = quizState.isExam;
            const correctAnswer = isExam ? q.a : q.answer;
            const user = getActiveUser();

            q.options.forEach((opt, idx) => {
                const btn = document.getElementById(`opt-btn-${idx}`);
                btn.disabled = true;
                if (opt === correctAnswer) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-emerald-500 bg-emerald-600 text-white shadow";
                } else if (opt === selected) {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-rose-800 bg-rose-950 text-rose-300";
                } else {
                    btn.className = "w-full p-3.5 rounded-2xl font-bold text-left text-xs sm:text-sm border border-slate-800 opacity-40 bg-slate-900 text-slate-500";
                }
            });

            const nextBtn = document.getElementById('btn-next-quiz');
            nextBtn.disabled = false;
            nextBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow transition text-xs cursor-pointer";

            if (!isExam) {
                const feedbackArea = document.getElementById('feedback-area');
                if (selected === correctAnswer) {
                    quizState.score++;
                    user.stars += 15;
                    saveProfiles();
                    document.getElementById('star-count').innerText = user.stars;
                    feedbackArea.innerHTML = `
                        <div class="bg-emerald-950 border border-emerald-800 p-4 rounded-2xl text-emerald-300 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">✓ Jawaban Tepat!</p>
                            <p>${q.explanation}</p>
                        </div>
                    `;
                } else {
                    feedbackArea.innerHTML = `
                        <div class="bg-amber-950 border border-amber-800 p-4 rounded-2xl text-amber-200 font-bold text-xs animate-fade-in">
                            <p class="font-black text-sm mb-1">💡 Belum Tepat</p>
                            <p>${q.hints ? q.hints[0] : 'Perhatikan kembali trik penyelesaiannya.'}</p>
                        </div>
                    `;
                }
            } else {
                if (selected === correctAnswer) quizState.score++;
            }
        }

        function handleNextQuestion() {
            if (!quizState.selectedOption) return;
            quizState.currentIndex++;
            quizState.selectedOption = null;

            if (quizState.currentIndex < quizState.questions.length) {
                renderQuiz(document.getElementById('main-content'));
            } else {
                if (quizState.isExam) {
                    router('examResult');
                } else {
                    router('examIntro', activeLevelId);
                }
            }
        }

        function renderExamResult(container) {
            const percentage = Math.round((quizState.score / quizState.questions.length) * 100);
            const passed = percentage >= 80;
            const user = getActiveUser();

            if (passed) {
                if (!user.completedLevels.includes(activeLevelId)) user.completedLevels.push(activeLevelId);
                const nextLevel = activeLevelId + 1;
                if (nextLevel <= 10 && !user.unlockedLevels.includes(nextLevel)) user.unlockedLevels.push(nextLevel);
                user.stars += 100;

                const badgesMap = {
                    1: "🏅 Number Theory Expert", 2: "📊 Ratio Pro", 3: "🧮 Algebra Master", 4: "📐 Geometry Master",
                    5: "🏎️ Speed Elite", 6: "🎲 Combinatorics Genius", 7: "💡 Logic Grandmaster", 8: "🔥 Series Pro",
                    9: "🧠 Gold Medalist", 10: "🏆 IMO GRAND MASTER"
                };
                if (badgesMap[activeLevelId] && !user.badges.includes(badgesMap[activeLevelId])) {
                    user.badges.push(badgesMap[activeLevelId]);
                }
                saveProfiles();
            }

            container.innerHTML = `
                <div class="p-6 animate-fade-in flex flex-col justify-center text-center">
                    <div class="bg-slate-800 p-8 rounded-[2rem] shadow-2xl border border-slate-700">
                        <div class="text-6xl mb-3">${passed ? '🏆' : '💪'}</div>
                        <h2 class="text-xl font-black text-white mb-2">${passed ? 'UJIAN DITAKLUKKAN!' : 'BELUM LULUS'}</h2>
                        <p class="text-slate-300 font-medium mb-6 text-xs">${passed ? 'Luar biasa! Level berikutnya terbuka.' : 'Skor minimal kelulusan adalah 80. Coba lagi!'}</p>
                        
                        <div class="bg-slate-900 p-5 rounded-2xl mb-6 border border-slate-700">
                            <span class="text-[10px] text-slate-400 font-black uppercase">Skor Akhir</span>
                            <div class="text-5xl font-black my-2 ${passed ? 'text-emerald-400' : 'text-amber-400'}">${percentage}</div>
                            <span class="text-xs font-bold text-slate-300">Benar ${quizState.score} dari 5 soal</span>
                        </div>

                        ${passed ? `
                            <button onclick="router('map')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                                KLAIM & LANJUT KE PETA ➔
                            </button>
                        ` : `
                            <button onclick="router('lesson', ${activeLevelId})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl shadow transition text-xs">
                                ULANGI MATERI
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            if (profiles.length === 0) {
                router('profiles');
            } else {
                if (!currentUserId && profiles.length > 0) currentUserId = profiles[0].id;
                router('home');
            }
        };
    </script>
</body>
</html>
